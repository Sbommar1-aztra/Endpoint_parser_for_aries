swagger: "2.0"
info:
  title: Test API for Validation
  version: "1.0.0"
  description: A valid Swagger 2.0 test file for endpoint parser testing
  contact:
    name: API Support
    email: support@example.com

host: api.example.com
basePath: "/v1"
schemes:
  - https
  - http

tags:
  - name: users
    description: User management operations
  - name: products
    description: Product catalog operations

paths:
  /users:
    get:
      summary: List all users
      description: Retrieve a list of all users in the system
      tags:
        - users
      parameters:
        - name: page
          in: query
          type: integer
          description: Page number for pagination
          default: 1
        - name: limit
          in: query
          type: integer
          description: Number of items per page
          default: 10
      responses:
        "200":
          description: Successful response
          schema:
            type: array
            items:
              $ref: "#/definitions/User"
        "400":
          description: Bad request
    post:
      summary: Create a new user
      description: Add a new user to the system
      tags:
        - users
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/User"
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: "#/definitions/User"
        "400":
          description: Invalid input

  /users/{userId}:
    get:
      summary: Get user by ID
      description: Retrieve a specific user by their ID
      tags:
        - users
      parameters:
        - name: userId
          in: path
          required: true
          type: integer
          description: The ID of the user
      responses:
        "200":
          description: User found
          schema:
            $ref: "#/definitions/User"
        "404":
          description: User not found
    put:
      summary: Update user
      description: Update an existing user
      tags:
        - users
      parameters:
        - name: userId
          in: path
          required: true
          type: integer
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/User"
      responses:
        "200":
          description: User updated successfully
          schema:
            $ref: "#/definitions/User"
        "404":
          description: User not found
    delete:
      summary: Delete user
      description: Delete a user from the system
      tags:
        - users
      parameters:
        - name: userId
          in: path
          required: true
          type: integer
      responses:
        "204":
          description: User deleted successfully
        "404":
          description: User not found

  /products:
    get:
      summary: List all products
      description: Retrieve a list of all products
      tags:
        - products
      responses:
        "200":
          description: Successful response
          schema:
            type: array
            items:
              $ref: "#/definitions/Product"

definitions:
  User:
    type: object
    required:
      - name
      - email
    properties:
      id:
        type: integer
        format: int64
        description: Unique identifier for the user
      name:
        type: string
        description: User's full name
        example: "John Doe"
      email:
        type: string
        format: email
        description: User's email address
        example: "john.doe@example.com"
      age:
        type: integer
        minimum: 0
        maximum: 150
        description: User's age
      active:
        type: boolean
        default: true
        description: Whether the user account is active
      createdAt:
        type: string
        format: date-time
        description: Account creation timestamp

  Product:
    type: object
    required:
      - name
      - price
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        example: "Widget"
      price:
        type: number
        format: float
        minimum: 0
        description: Product price in USD
      description:
        type: string
      inStock:
        type: boolean
        default: true

