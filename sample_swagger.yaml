swagger: "2.0"
info:
  title: "Sample API for Testing"
  version: "1.0.0"
  description: "A sample API specification to test Swagger import functionality"
  contact:
    name: "API Support"
    email: "support@example.com"

host: "api.example.com"
basePath: "/v1"
schemes:
  - "https"
  - "http"

tags:
  - name: "users"
    description: "User management operations"
  - name: "products"
    description: "Product catalog operations"
  - name: "orders"
    description: "Order management operations"

paths:
  /users:
    get:
      summary: "List all users"
      description: "Retrieve a list of all users in the system"
      tags:
        - "users"
      parameters:
        - name: "page"
          in: "query"
          type: "integer"
          description: "Page number for pagination"
          default: 1
        - name: "limit"
          in: "query"
          type: "integer"
          description: "Number of items per page"
          default: 10
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/User"
        "400":
          description: "Bad request"
          schema:
            $ref: "#/definitions/Error"

    post:
      summary: "Create a new user"
      description: "Create a new user account"
      tags:
        - "users"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            $ref: "#/definitions/UserCreate"
      responses:
        "201":
          description: "User created successfully"
          schema:
            $ref: "#/definitions/User"
        "400":
          description: "Invalid input"
          schema:
            $ref: "#/definitions/Error"

  /users/{userId}:
    get:
      summary: "Get user by ID"
      description: "Retrieve a specific user by their ID"
      tags:
        - "users"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          type: "integer"
          description: "The user ID"
      responses:
        "200":
          description: "User found"
          schema:
            $ref: "#/definitions/User"
        "404":
          description: "User not found"
          schema:
            $ref: "#/definitions/Error"

    put:
      summary: "Update user"
      description: "Update an existing user's information"
      tags:
        - "users"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          type: "integer"
        - name: "body"
          in: "body"
          required: true
          schema:
            $ref: "#/definitions/UserUpdate"
      responses:
        "200":
          description: "User updated successfully"
          schema:
            $ref: "#/definitions/User"
        "404":
          description: "User not found"
          schema:
            $ref: "#/definitions/Error"

    delete:
      summary: "Delete user"
      description: "Delete a user from the system"
      tags:
        - "users"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          type: "integer"
      responses:
        "204":
          description: "User deleted successfully"
        "404":
          description: "User not found"
          schema:
            $ref: "#/definitions/Error"

  /products:
    get:
      summary: "List all products"
      description: "Get a list of all available products"
      tags:
        - "products"
      parameters:
        - name: "category"
          in: "query"
          type: "string"
          description: "Filter by category"
        - name: "inStock"
          in: "query"
          type: "boolean"
          description: "Filter by stock availability"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Product"

    post:
      summary: "Create a new product"
      description: "Add a new product to the catalog"
      tags:
        - "products"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            $ref: "#/definitions/ProductCreate"
      responses:
        "201":
          description: "Product created"
          schema:
            $ref: "#/definitions/Product"
        "400":
          description: "Invalid input"
          schema:
            $ref: "#/definitions/Error"

  /products/{productId}:
    get:
      summary: "Get product by ID"
      description: "Retrieve product details by ID"
      tags:
        - "products"
      parameters:
        - name: "productId"
          in: "path"
          required: true
          type: "string"
      responses:
        "200":
          description: "Product found"
          schema:
            $ref: "#/definitions/Product"
        "404":
          description: "Product not found"
          schema:
            $ref: "#/definitions/Error"

    patch:
      summary: "Update product partially"
      description: "Partially update product information"
      tags:
        - "products"
      parameters:
        - name: "productId"
          in: "path"
          required: true
          type: "string"
        - name: "body"
          in: "body"
          required: true
          schema:
            $ref: "#/definitions/ProductUpdate"
      responses:
        "200":
          description: "Product updated"
          schema:
            $ref: "#/definitions/Product"

  /orders:
    get:
      summary: "List all orders"
      description: "Get a list of all orders"
      tags:
        - "orders"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Order"

    post:
      summary: "Create a new order"
      description: "Place a new order"
      tags:
        - "orders"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            $ref: "#/definitions/OrderCreate"
      responses:
        "201":
          description: "Order created"
          schema:
            $ref: "#/definitions/Order"
        "400":
          description: "Invalid order data"
          schema:
            $ref: "#/definitions/Error"

  /orders/{orderId}:
    get:
      summary: "Get order by ID"
      description: "Retrieve order details by ID"
      tags:
        - "orders"
      parameters:
        - name: "orderId"
          in: "path"
          required: true
          type: "string"
      responses:
        "200":
          description: "Order found"
          schema:
            $ref: "#/definitions/Order"
        "404":
          description: "Order not found"
          schema:
            $ref: "#/definitions/Error"

    delete:
      summary: "Cancel order"
      description: "Cancel an existing order"
      tags:
        - "orders"
      parameters:
        - name: "orderId"
          in: "path"
          required: true
          type: "string"
      responses:
        "200":
          description: "Order cancelled"
          schema:
            $ref: "#/definitions/Order"
        "404":
          description: "Order not found"
          schema:
            $ref: "#/definitions/Error"

definitions:
  User:
    type: "object"
    required:
      - "id"
      - "email"
      - "name"
    properties:
      id:
        type: "integer"
        format: "int64"
        description: "Unique user identifier"
      email:
        type: "string"
        format: "email"
        description: "User email address"
      name:
        type: "string"
        description: "User full name"
      age:
        type: "integer"
        minimum: 0
        maximum: 150
        description: "User age"
      status:
        type: "string"
        enum:
          - "active"
          - "inactive"
          - "suspended"
        description: "User account status"
      createdAt:
        type: "string"
        format: "date-time"
        description: "Account creation timestamp"

  UserCreate:
    type: "object"
    required:
      - "email"
      - "name"
      - "password"
    properties:
      email:
        type: "string"
        format: "email"
      name:
        type: "string"
      password:
        type: "string"
        format: "password"
        minLength: 8
      age:
        type: "integer"

  UserUpdate:
    type: "object"
    properties:
      name:
        type: "string"
      email:
        type: "string"
        format: "email"
      age:
        type: "integer"
      status:
        type: "string"
        enum:
          - "active"
          - "inactive"
          - "suspended"

  Product:
    type: "object"
    required:
      - "id"
      - "name"
      - "price"
    properties:
      id:
        type: "string"
        description: "Product unique identifier"
      name:
        type: "string"
        description: "Product name"
      description:
        type: "string"
        description: "Product description"
      price:
        type: "number"
        format: "float"
        minimum: 0
        description: "Product price"
      category:
        type: "string"
        description: "Product category"
      inStock:
        type: "boolean"
        description: "Stock availability"
      stockQuantity:
        type: "integer"
        minimum: 0
        description: "Available stock quantity"
      tags:
        type: "array"
        items:
          type: "string"
        description: "Product tags"

  ProductCreate:
    type: "object"
    required:
      - "name"
      - "price"
    properties:
      name:
        type: "string"
      description:
        type: "string"
      price:
        type: "number"
        format: "float"
        minimum: 0
      category:
        type: "string"
      inStock:
        type: "boolean"
        default: true
      stockQuantity:
        type: "integer"
        minimum: 0

  ProductUpdate:
    type: "object"
    properties:
      name:
        type: "string"
      description:
        type: "string"
      price:
        type: "number"
        format: "float"
      inStock:
        type: "boolean"
      stockQuantity:
        type: "integer"

  Order:
    type: "object"
    required:
      - "id"
      - "userId"
      - "items"
      - "total"
    properties:
      id:
        type: "string"
        description: "Order unique identifier"
      userId:
        type: "integer"
        description: "User who placed the order"
      items:
        type: "array"
        items:
          type: "object"
          required:
            - "productId"
            - "quantity"
            - "price"
          properties:
            productId:
              type: "string"
            productName:
              type: "string"
            quantity:
              type: "integer"
              minimum: 1
            price:
              type: "number"
              format: "float"
        description: "Order items"
      total:
        type: "number"
        format: "float"
        description: "Total order amount"
      status:
        type: "string"
        enum:
          - "pending"
          - "processing"
          - "shipped"
          - "delivered"
          - "cancelled"
        description: "Order status"
      createdAt:
        type: "string"
        format: "date-time"
        description: "Order creation timestamp"

  OrderCreate:
    type: "object"
    required:
      - "items"
    properties:
      items:
        type: "array"
        items:
          type: "object"
          required:
            - "productId"
            - "quantity"
          properties:
            productId:
              type: "string"
            quantity:
              type: "integer"
              minimum: 1

  Error:
    type: "object"
    required:
      - "code"
      - "message"
    properties:
      code:
        type: "integer"
        description: "Error code"
      message:
        type: "string"
        description: "Error message"
      details:
        type: "string"
        description: "Additional error details"
