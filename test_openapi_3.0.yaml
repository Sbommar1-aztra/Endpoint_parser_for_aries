openapi: 3.0.0
info:
  title: "Test API"
  version: "1.0.0"
  description: "A test API for parser validation - OpenAPI 3.0"
servers:
  - url: https://api.example.com/v1
    description: Production server
paths:
  /users:
    get:
      summary: "List all users"
      description: "Retrieves a list of all users"
      operationId: listUsers
      tags:
        - users
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: "Create a new user"
      description: "Creates a new user. Requires authentication."
      operationId: createUser
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: "User created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}:
    get:
      summary: "Get user by ID"
      description: "Retrieves a specific user by their userId"
      operationId: getUserById
      tags:
        - users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: "The user ID"
      responses:
        "200":
          description: "User found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: "User not found"
    put:
      summary: "Update user"
      description: "Updates an existing user. Requires the user to exist first."
      operationId: updateUser
      tags:
        - users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: "User updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      summary: "Delete user"
      operationId: deleteUser
      tags:
        - users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "User deleted"
  /orders:
    get:
      summary: "List orders"
      tags:
        - orders
      responses:
        "200":
          description: "List of orders"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: "Create order"
      description: "Creates a new order. Requires an existing user (userId)."
      tags:
        - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: "Order created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    get:
      summary: "Get order by ID"
      tags:
        - orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Order found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
          description: "Unique user identifier"
        name:
          type: string
          description: "User's full name"
        email:
          type: string
          format: email
          description: "User's email address"
        createdAt:
          type: string
          format: date-time
          description: "Account creation timestamp"
      required:
        - userId
        - name
        - email
    UserInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
      required:
        - name
        - email
    Order:
      type: object
      properties:
        orderId:
          type: string
          description: "Unique order identifier"
        userId:
          type: string
          description: "ID of the user who placed the order"
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1
              price:
                type: number
                minimum: 0
        total:
          type: number
          minimum: 0
        status:
          type: string
          enum:
            - pending
            - processing
            - shipped
            - delivered
            - cancelled
      required:
        - orderId
        - userId
        - items
        - total
    OrderInput:
      type: object
      properties:
        userId:
          type: string
          description: "ID of the user placing the order"
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1
            required:
              - productId
              - quantity
      required:
        - userId
        - items
